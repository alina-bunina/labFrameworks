version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: labjava
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0419
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labjava"]
      interval: 5s
      retries: 10

  tomcat:
    build:
      context: .
      dockerfile: docker/tomcat/Dockerfile
    container_name: tomcat-web
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: labjava
      DB_USER: postgres
      DB_PASS: 0419

volumes:
  pgdata:


